<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <title id="title">LeetcodeNotes</title>
  <desc id="desc">Horizontal vector logo with a coding notebook and pencil on the left and LeetcodeNotes wordmark on the right.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB02E"/>
      <stop offset="1" stop-color="#F47716"/>
    </linearGradient>
  </defs>

  <!-- Notebook icon -->
  <g transform="translate(285 202) rotate(-8)" stroke="#17243B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-142 -104 Q-142 -129 -116 -129 H104 Q130 -129 130 -103 V105 Q130 130 104 130 H-112 Q-142 130 -142 101 Z"
          fill="#FFFFFF"/>
    <path d="M-123 -92 V91 Q-123 112 -101 112 H111" fill="none" stroke="#AEB9C8" stroke-width="5"/>
    <!-- spiral binding -->
    <path d="M-91 -129 V-151 M-21 -129 V-151 M49 -129 V-151" fill="none"/>
    <path d="M-103 -151 a12 12 0 1 0 24 0 M-33 -151 a12 12 0 1 0 24 0 M37 -151 a12 12 0 1 0 24 0"
          fill="none"/>
    <!-- code mark -->
    <path d="M-70 -22 L-101 5 L-70 32 M-10 -22 L-41 5 L-10 32" fill="none" stroke-width="12"/>
    <path d="M5 -29 L-17 42" fill="none" stroke="url(#orange)" stroke-width="12"/>
    <!-- notes lines -->
    <path d="M35 -31 H92 M35 5 H82 M35 41 H69" fill="none" stroke="#BEC8D5" stroke-width="7"/>
  </g>

  <!-- Pencil -->
  <g transform="translate(395 125) rotate(35)" stroke="#17243B" stroke-width="8" stroke-linejoin="round">
    <rect x="-23" y="-103" width="46" height="172" rx="8" fill="url(#orange)"/>
    <path d="M-23 -75 H23" fill="none" stroke="#FFD27A" stroke-width="6"/>
    <path d="M-23 69 L0 111 L23 69 Z" fill="#FFE0A6"/>
    <path d="M-7 98 L0 111 L7 98 Z" fill="#17243B" stroke="none"/>
    <path d="M-23 -103 Q-23 -124 0 -124 Q23 -124 23 -103 V-88 H-23 Z" fill="#DCE3EC"/>
  </g>

  <!-- Orange orbit / motion stroke -->
  <path d="M72 251 C126 310 223 312 331 274 C385 255 425 224 451 190"
        fill="none" stroke="url(#orange)" stroke-width="13" stroke-linecap="round"/>
  <path d="M435 190 L458 176 L453 202" fill="none" stroke="#F47716" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="555" y="238" font-family="Arial, Helvetica, sans-serif" font-size="112"
        font-weight="800" letter-spacing="-4">
    <tspan fill="#17243B">Leetcode</tspan><tspan fill="#F47716">Notes</tspan>
  </text>
  <path d="M655 283 Q1000 326 1390 283" fill="none" stroke="url(#orange)" stroke-width="8" stroke-linecap="round"/>
</svg>
